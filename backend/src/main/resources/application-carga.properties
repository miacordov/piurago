# Perfil para cargar las rutas y paraderos en la base. Se usa junto al perfil
# con las credenciales: ./mvnw spring-boot:run -Dspring-boot.run.profiles=local,carga
# Los scripts corren antes de que Hibernate valide el esquema y se pueden
# ejecutar más de una vez (ver backend/README.md, "Base de datos"). No levanta
# el servidor web: carga los datos y termina.
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.schema-locations=file:db/migraciones/001_ruta_datos_servicio.sql
spring.sql.init.data-locations=file:db/seeds/001_rutas_paraderos_piuratransporta.sql
spring.main.web-application-type=none
