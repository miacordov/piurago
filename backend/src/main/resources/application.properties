spring.application.name=piuragopiura-backend

# --- Base de datos (Neon) ---
# Los valores reales NO van en este archivo. Ver README.md (seccion "Credenciales").
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# --- Actuator ---
# Solo health (público, para un monitor externo como UptimeRobot) e info (con token).
# Health responde solo {"status":"UP"} o "DOWN": sin detalles de la base ni del disco.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.info.env.enabled=true
info.app.nombre=PiuraGo backend
info.app.descripcion=API de rutas de transporte urbano de Piura con GPS colaborativo

# --- JWT ---
# Clave de firma: minimo 32 caracteres, aleatoria. Se define fuera del repositorio.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# --- CORS ---
# En produccion definir APP_CORS_ALLOWED_ORIGIN_PATTERNS con el dominio real (nunca *).
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}

# --- Congestión ---
# Recalcula el histórico de todas las rutas cada hora (el primero, 2 min después de arrancar).
piurago.congestion.recalculo-automatico=true
piurago.congestion.recalculo-ms=3600000
piurago.congestion.recalculo-inicial-ms=120000
